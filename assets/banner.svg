<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#0a1a10"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="40 40" dur="4s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="0" width="1200" height="2" fill="url(#glow)">
    <animate attributeName="y" from="0" to="320" dur="6s" repeatCount="indefinite"/>
  </rect>
  <path d="M 40 40 L 40 80 M 40 40 L 80 40" stroke="#00ff88" stroke-width="3" fill="none"/>
  <path d="M 1160 40 L 1160 80 M 1160 40 L 1120 40" stroke="#00ff88" stroke-width="3" fill="none"/>
  <path d="M 40 280 L 40 240 M 40 280 L 80 280" stroke="#00ff88" stroke-width="3" fill="none"/>
  <path d="M 1160 280 L 1160 240 M 1160 280 L 1120 280" stroke="#00ff88" stroke-width="3" fill="none"/>
  <circle cx="70" cy="160" r="6" fill="#00ff88" filter="url(#glow-filter)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="150" text-anchor="middle" font-family="'Courier New', monospace" font-size="82" font-weight="900" fill="#ffffff" filter="url(#glow-filter)" letter-spacing="8">AYUSH</text>
  <line x1="380" y1="175" x2="820" y2="175" stroke="#00ff88" stroke-width="2">
    <animate attributeName="x1" values="600;380;600" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="600;820;600" dur="3s" repeatCount="indefinite"/>
  </line>
  <text x="600" y="215" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" fill="#00ff88" letter-spacing="4">&#47;&#47; AI &amp; FULL-STACK DEVELOPER</text>
  <rect x="820" y="200" width="12" height="20" fill="#00ff88">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="600" y="270" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#666666" letter-spacing="2">[ BUILDING INTELLIGENT SYSTEMS · ONE COMMIT AT A TIME ]</text>
</svg>
