<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700">
  <defs>
    <radialGradient id="radar-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a1a10"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="radar-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="700" height="700" fill="url(#radar-bg)"/>
  <g transform="translate(350,350)" fill="none" stroke="#00ff88" stroke-opacity="0.25">
    <circle r="80"/>
    <circle r="140"/>
    <circle r="200"/>
    <circle r="260"/>
  </g>
  <g stroke="#00ff88" stroke-opacity="0.3" stroke-width="1">
    <line x1="350" y1="90" x2="350" y2="610"/>
    <line x1="90" y1="350" x2="610" y2="350"/>
    <line x1="166" y1="166" x2="534" y2="534"/>
    <line x1="534" y1="166" x2="166" y2="534"/>
  </g>
  <g transform="translate(350,350)">
    <polygon points="0,-230 180,-120 200,60 120,200 -140,180 -220,-40 -140,-140" fill="url(#radar-fill)" stroke="#00ff88" stroke-width="2">
      <animateTransform attributeName="transform" type="scale" values="1;1.03;1" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="0" cy="-230" r="5" fill="#00ff88"/>
    <circle cx="180" cy="-120" r="5" fill="#00ff88"/>
    <circle cx="200" cy="60" r="5" fill="#00ff88"/>
    <circle cx="120" cy="200" r="5" fill="#00ff88"/>
    <circle cx="-140" cy="180" r="5" fill="#00ff88"/>
    <circle cx="-220" cy="-40" r="5" fill="#00ff88"/>
    <circle cx="-140" cy="-140" r="5" fill="#00ff88"/>
  </g>
  <g font-family="'Courier New', monospace" font-size="14" fill="#00ff88" font-weight="bold">
    <text x="350" y="80" text-anchor="middle">PYTHON</text>
    <text x="600" y="230" text-anchor="middle">TYPESCRIPT</text>
    <text x="610" y="440" text-anchor="middle">JAVASCRIPT</text>
    <text x="500" y="600" text-anchor="middle">REACT / NEXT</text>
    <text x="180" y="610" text-anchor="middle">NODE.JS</text>
    <text x="70" y="450" text-anchor="middle">AI / LLM</text>
    <text x="90" y="230" text-anchor="middle">TOOLING</text>
  </g>
  <text x="350" y="355" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#ffffff" font-weight="bold">SKILLS</text>
  <g transform="translate(350,350)">
    <line x1="0" y1="0" x2="0" y2="-260" stroke="#00ff88" stroke-width="2" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </line>
  </g>
</svg>
