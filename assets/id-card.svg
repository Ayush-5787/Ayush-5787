<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#0a1a10"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="avatar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <pattern id="card-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00ff88" stroke-width="0.3" opacity="0.08"/>
    </pattern>
    <filter id="card-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card background -->
  <rect x="10" y="10" width="680" height="380" rx="16" fill="url(#card-bg)" stroke="#00ff88" stroke-width="2"/>
  <rect x="10" y="10" width="680" height="380" rx="16" fill="url(#card-grid)"/>

  <!-- Top accent line -->
  <rect x="80" y="35" width="540" height="2" fill="url(#accent-line)"/>

  <!-- Header text -->
  <text x="40" y="65" font-family="'Courier New', monospace" font-size="12" fill="#00ff88" letter-spacing="3" opacity="0.7">// DEVELOPER IDENTIFICATION</text>
  <text x="660" y="65" text-anchor="end" font-family="'Courier New', monospace" font-size="12" fill="#00ff88" letter-spacing="3" opacity="0.7">ID: 5787</text>

  <!-- Animated avatar area (no photo) -->
  <circle cx="130" cy="180" r="90" fill="url(#avatar-glow)"/>
  <circle cx="130" cy="180" r="80" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.3"/>
  <circle cx="130" cy="180" r="65" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.5"/>
  <circle cx="130" cy="180" r="50" fill="#0a1a10" stroke="#00ff88" stroke-width="2"/>
  <text x="130" y="200" text-anchor="middle" font-family="'Courier New', monospace" font-size="52" fill="#00ff88" filter="url(#card-glow)">⚡</text>

  <!-- Orbiting ring -->
  <circle cx="130" cy="180" r="95" fill="none" stroke="#00ff88" stroke-width="1" stroke-dasharray="4 6" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="0 130 180" to="360 130 180" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Status badge -->
  <rect x="78" y="270" width="105" height="22" rx="11" fill="#00ff88" fill-opacity="0.15" stroke="#00ff88" stroke-width="1"/>
  <circle cx="92" cy="281" r="4" fill="#00ff88" filter="url(#card-glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="104" y="286" font-family="'Courier New', monospace" font-size="11" fill="#00ff88" letter-spacing="1">ONLINE</text>

  <!-- Right side info -->
  <text x="250" y="115" font-family="'Courier New', monospace" font-size="11" fill="#00ff88" letter-spacing="2" opacity="0.6">NAME</text>
  <text x="250" y="140" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="#ffffff" filter="url(#card-glow)">AYUSH</text>

  <text x="250" y="175" font-family="'Courier New', monospace" font-size="11" fill="#00ff88" letter-spacing="2" opacity="0.6">ROLE</text>
  <text x="250" y="198" font-family="'Courier New', monospace" font-size="15" fill="#00ff88">AI &amp; Full-Stack Developer</text>

  <text x="250" y="233" font-family="'Courier New', monospace" font-size="11" fill="#00ff88" letter-spacing="2" opacity="0.6">EDUCATION</text>
  <text x="250" y="256" font-family="'Courier New', monospace" font-size="13" fill="#ffffff">B.Tech CSE · PSIT Kanpur · 3rd Year</text>

  <!-- Bottom row stats -->
  <rect x="40" y="300" width="620" height="65" rx="8" fill="#00ff88" fill-opacity="0.05" stroke="#00ff88" stroke-opacity="0.3" stroke-width="1"/>
  <text x="80" y="322" font-family="'Courier New', monospace" font-size="10" fill="#00ff88" opacity="0.6" letter-spacing="2">STACK</text>
  <text x="80" y="345" font-family="'Courier New', monospace" font-size="13" fill="#ffffff">TS · JS · Python · React</text>

  <text x="310" y="322" font-family="'Courier New', monospace" font-size="10" fill="#00ff88" opacity="0.6" letter-spacing="2">FOCUS</text>
  <text x="310" y="345" font-family="'Courier New', monospace" font-size="13" fill="#ffffff">AI · Agents · Full-Stack</text>

  <text x="530" y="322" font-family="'Courier New', monospace" font-size="10" fill="#00ff88" opacity="0.6" letter-spacing="2">LOCATION</text>
  <text x="530" y="345" font-family="'Courier New', monospace" font-size="13" fill="#ffffff">Kanpur, India 🇮🇳</text>

  <!-- Bottom accent line -->
  <rect x="80" y="378" width="540" height="2" fill="url(#accent-line)"/>

  <!-- Decorative corner brackets -->
  <path d="M 25 50 L 25 25 L 50 25" stroke="#00ff88" stroke-width="2" fill="none"/>
  <path d="M 650 25 L 675 25 L 675 50" stroke="#00ff88" stroke-width="2" fill="none"/>
  <path d="M 25 350 L 25 375 L 50 375" stroke="#00ff88" stroke-width="2" fill="none"/>
  <path d="M 650 375 L 675 375 L 675 350" stroke="#00ff88" stroke-width="2" fill="none"/>
</svg>
