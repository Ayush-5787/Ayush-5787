<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 700 400" width="700" height="400">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#0a1a10"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ff88" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <pattern id="card-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00ff88" stroke-width="0.3" opacity="0.08"/>
    </pattern>
    <filter id="card-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="photo-clip">
      <rect x="40" y="90" width="180" height="180" rx="10"/>
    </clipPath>
  </defs>
  <rect x="10" y="10" width="680" height="380" rx="16" fill="url(#card-bg)" stroke="#00ff88" stroke-width="2"/>
  <rect x="10" y="10" width="680" height="380" rx="16" fill="url(#card-grid)"/>
  <rect x="80" y="35" width="540" height="2" fill="url(#accent-line)"/>
  <text x="40" y="65" font-family="'Courier New', monospace" font-size="12" fill="#00ff88" letter-spacing="3" opacity="0.7">// DEVELOPER IDENTIFICATION</text>
  <text x="660" y="65" text-anchor="end" font-family="'Courier New', monospace" font-size="12" fill="#00ff88" letter-spacing="3" opacity="0.7">ID: 5787</text>
  <rect x="40" y="90" width="180" height="180" rx="10" fill="#0a1a10" stroke="#00ff88" stroke-width="2"/>
  <image x="40" y="90" width="180" height="180" preserveAspectRatio="xMidYMid meet" clip-path="url(#photo-clip)" xlink:href="https://raw.githubusercontent.com/Ayush-5787/Ayush-5787/main/assets/profile.jpg"/>
  <circle cx="205" cy="105" r="6" fill="#00ff88" filter="url(#card-glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="250" y="115" font-family="'Courier New', monospace" font-size="11" fill="#00ff88" letter-spacing="2" opacity="0.6">NAME</text>
  <text x="250" y="140" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="#ffffff" filter="url(#card-glow)">AYUSH</text>
  <text x="250" y="175" font-family="'Courier New', monospace" font-size="11" fill="#00ff88" letter-spacing="2" opacity="0.6">ROLE</text>
  <text x="250" y="198" font-family="'Courier New', monospace" font-size="15" fill="#00ff88">AI &amp; Full-Stack Developer</text>
  <text x="250" y="233" font-family="'Courier New', monospace" font-size="11" fill="#00ff88" letter-spacing="2" opacity="0.6">EDUCATION</text>
  <text x="250" y="256" font-family="'Courier New', monospace" font-size="13" fill="#ffffff">B.Tech CSE · PSIT Kanpur</text>
  <rect x="40" y="295" width="620" height="70" rx="8" fill="#00ff88" fill-opacity="0.05" stroke="#00ff88" stroke-opacity="0.3" stroke-width="1"/>
  <text x="80" y="320" font-family="'Courier New', monospace" font-size="10" fill="#00ff88" opacity="0.6" letter-spacing="2">STACK</text>
  <text x="80" y="345" font-family="'Courier New', monospace" font-size="13" fill="#ffffff">TS · JS · Python · React</text>
  <text x="310" y="320" font-family="'Courier New', monospace" font-size="10" fill="#00ff88" opacity="0.6" letter-spacing="2">FOCUS</text>
  <text x="310" y="345" font-family="'Courier New', monospace" font-size="13" fill="#ffffff">AI · Agents · Full-Stack</text>
  <text x="530" y="320" font-family="'Courier New', monospace" font-size="10" fill="#00ff88" opacity="0.6" letter-spacing="2">LOCATION</text>
  <text x="530" y="345" font-family="'Courier New', monospace" font-size="13" fill="#ffffff">Kanpur, India 🇮🇳</text>
  <rect x="80" y="378" width="540" height="2" fill="url(#accent-line)"/>
  <path d="M 25 50 L 25 25 L 50 25" stroke="#00ff88" stroke-width="2" fill="none"/>
  <path d="M 650 25 L 675 25 L 675 50" stroke="#00ff88" stroke-width="2" fill="none"/>
  <path d="M 25 350 L 25 375 L 50 375" stroke="#00ff88" stroke-width="2" fill="none"/>
  <path d="M 650 375 L 675 375 L 675 350" stroke="#00ff88" stroke-width="2" fill="none"/>
</svg>
