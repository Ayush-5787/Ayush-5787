name: Update Profile Assets

on:
  schedule:
    - cron: "0 6 * * *" # Runs every day at 06:00 UTC
  workflow_dispatch: # Allows manual trigger from Actions tab
  push:
    branches: ["main"]

permissions:
  contents: write
  metrics: read

jobs:
  generate-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate GitHub Metrics (Heatmap + Stats)
        uses: lowlighter/metrics@latest
        with:
          filename: contrib-heatmap.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: "" # Disable all plugins except what we enable below
          plugin_isocalendar: yes # Adds the classic calendar heatmap
          plugin_isocalendar_duration: full-year
          
      - name: Generate Trophy Case (Optional but cool)
        uses: lowlighter/metrics@latest
        with:
          filename: trophy-case.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ""
          plugin_trophies: yes
          plugin_trophies_grade: AAA

      - name: Commit Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "chore: auto-update profile assets" || echo "No changes to commit"
          git push origin main