name: Profile Summary

on:
  schedule:
    - cron: "0 6 * * *" # Runs daily at 6 AM UTC
  workflow_dispatch: # Allows manual trigger from Actions tab
  push:
    branches: ["main"]

jobs:
  summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to update SVGs
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate Metrics (Heatmap)
        uses: lowlighter/metrics@latest
        with:
          filename: contrib-heatmap.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          base: "" # Disable default plugins
          plugin_isocalendar: yes # Enables the contribution calendar
          plugin_isocalendar_duration: full-year
          
      - name: Commit Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add contrib-heatmap.svg
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update heatmap"
          git push origin main