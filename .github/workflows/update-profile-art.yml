name: Update Profile Assets

on:
  schedule:
    - cron: "0 6 * * *" # Runs daily at 6 AM UTC
  workflow_dispatch: # Allows manual trigger
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write # Essential for pushing changes back
      
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch Contributions & Render Heatmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Run from root so relative paths work
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py

      - name: Commit Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Only commit if files changed
          git add contrib-heatmap.svg data/contributions.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: auto-update heatmap"
          git push origin main